# .cargo/config.toml — Local multi-repo development overrides for gaugeblock
# Configures shared build cache, sccache compiler caching, and native instruction tuning.

[build]
# Share build artifacts across all member repositories to eliminate duplicate compilation
target-dir = "target"

# Fast compiler caching via sccache
rustc-wrapper = "sccache"

# Incremental artefacts are not worth their disk here: sccache already caches compilation units,
# and `target/debug/incremental` grows by ~0.5-1.5 GB per multi-repo session (GB-187). This must be
# `[build] incremental`, not `[env] CARGO_INCREMENTAL` - the `[env]` table is applied to the processes
# cargo spawns (rustc, build scripts), not to cargo's own decision to enable incrementality.
incremental = false

# Target host CPU architecture (AVX2/FMA/BMI on x86_64, NEON on ARM64)
rustflags = ["-C", "target-cpu=native"]

# macOS-specific linking optimization: bypass slow dsymutil on debug builds
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "target-cpu=native", "-C", "split-debuginfo=unpacked"]

[env]
# Raise the sccache capacity above its 10 GiB default so the shared dependency and
# proc-macro cache for all 11 workspace targets is not evicted mid-suite-release (LRU
# thrashing would otherwise force recompilation of syn/tokio/serde between repositories).
#
# NOTE: `CARGO_INCREMENTAL` does not belong here. The `[env]` table is applied to the processes cargo
# spawns (rustc, build scripts), not to cargo itself, so putting the knob here has no effect - it is
# `[build] incremental` above that actually turns incrementality off (GB-187).
SCCACHE_CACHE_SIZE = "15G"

[patch.crates-io]
# --- 1. miter (AST Slicer, Dependency Grapher & Verification Engine) ---
miter-cli      = { path = "./miter" }
miter-engine   = { path = "./miter/crates/engine" }
miter-ast      = { path = "./miter/crates/ast_indexer" }
miter-storage  = { path = "./miter/crates/storage" }
miter-mcp      = { path = "./miter/crates/mcp" }
miter-harness  = { path = "./miter/crates/harness" }
# The three crates GB-203 split out of the engine. They are mapped here because consumers now name
# them directly instead of reaching through the `miter-engine` facade (`GB-204`), and none of them is
# published yet - they are the five names OF-5 has to reserve before the next release can publish.
miter-polyglot = { path = "./miter/crates/polyglot" }
miter-inventory = { path = "./miter/crates/inventory" }
miter-analysis = { path = "./miter/crates/analysis" }

# --- 2. storypole (Backlog, Task DAG & Memory Store) ---
storypole      = { path = "./storypole" }
storypole-core = { path = "./storypole/crates/storypole-core" }
storypole-cli  = { path = "./storypole/crates/storypole-cli" }
storypole-mcp  = { path = "./storypole/crates/storypole-mcp" }

# --- 3. sawhorse (Provider-Agnostic 3-Mode LLM Runtime) ---
