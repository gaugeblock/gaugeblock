[suite]
# The repositories this suite contains. Membership is declared rather than inferred, because a
# member carries its own .gaugeblock and a suite root is itself a git repository containing members,
# so layout alone cannot tell them apart (GB-324). An empty list means the suite answers for nobody.
members = [
    "batten",
    "benchwork",
    "chalkline",
    "common",
    "dado",
    "joiner",
    "miter",
    "outfeed",
    "rabbet",
    "sawhorse",
    "storypole",
]

[docs.agents]
path = "AGENTS.md"
required = true

[docs.architecture]
path = "ARCHITECTURE.md"
required = true

[docs.changelog]
path = "CHANGELOG.md"
required = true

[docs.contributing]
path = "CONTRIBUTING.md"
required = true

[docs.design]
path = "DESIGN.md"
required = false

[docs.product]
path = "PRODUCT.md"
required = true

[docs.readme]
path = "README.md"
required = true

[docs.roadmap]
path = "ROADMAP.md"
required = false

[docs.spec]
path = "SPEC.md"
required = true

[policies]
enforce_changelog_unreleased = true
enforce_contributing_toolchains = true
enforce_crate_topology = true
enforce_file_loc_limits = true
enforce_public_type_contracts = true
enforce_readme_cli_flags = true

[sawhorse.providers.universal]
api_key_env = "CLINE_API_KEY"
base_url = "https://api.cline.bot/api/v1"
dialect = "standard_open_ai"
mode = "open_ai_compatible"
# ClinePass is a curated set of documented ids, NOT a namespace - you cannot prefix an arbitrary
# catalogue model and have it work. This id is one of the fifteen listed at
# https://docs.cline.bot/getting-started/clinepass#models (captured 2026-10-29). The same model
# without the prefix (`deepseek/deepseek-v4.1-flash-1017`) is in the /models catalogue but bills
# Cline credits and answers 402 on an empty balance. `sawhorse models` labels which ids the
# subscription actually covers.
model_name = "cline-pass/deepseek-v4.1-flash-1017"

# Declared limits (GB-215). The provider API exposes ids only - `/models` has no metadata,
# `/models/{id}` is 404, and a completion's `usage` reports what a prompt cost rather than the
# ceiling - so the window is stated here and used as the cap for a sliding output budget.
# 1M is the documented window for this model; 32K output leaves room for a whole function.
context_window = 1000000
max_output_tokens = 32768

# Reasoning effort for this provider when a caller does not choose one. `medium` is the owner's
# preference for interactive work; the hole filler overrides it to `none` by default because filling
# is deterministic, and raises it only when a caller asks.
reasoning_effort = "medium"

[sawhorse.roles.hole_filler]
fallback = ["universal"]
provider = "universal"

[sawhorse.roles.oracle]
fallback = ["universal"]
provider = "universal"

[sawhorse.roles.planner]
fallback = ["universal"]
provider = "universal"

[sawhorse.roles.system1_router]
fallback = ["universal"]
provider = "universal"

# A reasoning model at `medium` effort with a 32K output budget does not answer in 60s: two runs
# failed as transport errors at exactly 60s, which is the timeout and not the network (GB-215).
[sawhorse.timeouts]
inference_timeout_secs = 300
ping_timeout_secs = 10

[storypole]
allowed_crates = []
allowed_repos = []
claim_ttl_minutes = 60
ticket_prefix = "GB"
verification_commands = [["rabbet", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["dado", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["chalkline", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["storypole", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["miter", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["joiner", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["batten", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["outfeed", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["sawhorse", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["benchwork", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["common", "cargo fmt --all -- --check && cargo clippy --workspace --all-targets -- -D warnings && cargo nextest run --workspace && miter audit --path . --threshold 250 --paths && chalkline docs check -d ."], ["gaugeblock", "miter contracts && outfeed lockfiles && miter audit --path . --threshold 250 --paths && chalkline docs check --workspace"], ["default", "miter contracts && outfeed lockfiles && miter audit --path . --threshold 250 --paths && chalkline docs check --workspace"]]
[telemetry]
#TEMP
# Invocation spans are emitted by default (ADR 0012). This switch is read at runtime, not a Cargo
# feature, so the same binary can be quiet in CI and chatty on a developer machine (SP-2).
# Precedence: GAUGEBLOCK_NO_TELEMETRY in the environment wins over this file, which wins over the
# default of true. Set false to keep the log clean during scripted runs of the whole suite.
enabled = true
