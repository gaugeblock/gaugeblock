# Lateral-edge allowlist: exceptions to the layering rule declared in GB-202.
#
# An edge is lateral when both crates sit in the same layer and belong to different products. These
# are the cross-product edges measured on 2026-11-06: 4 lateral, 139 downward, 0 upward. Every entry
# names the ticket that owes the burn-down, because an exception without an owner is a suppression.
#
# How an entry leaves this file: the site count reaches zero. GB-204 owns that work, choosing per
# call site between (a) moving shared types into gaugeblock-contracts or gaugeblock-workspace,
# (b) depending on a lower-layer crate instead of a whole product, and (c) inverting control behind
# a trait or a CLI boundary. Partial progress must not silence the gate, so an entry is deleted by
# hand only when the edge is gone from `miter deps --layers`.
#
# 2026-11-06 (GB-204 step 3): the layer model gained an `orchestrator` layer, ranked above `domain`.
# `joiner-core` and `benchwork-core` are composition roots - composing other products IS their
# product - so their edges to any product core are downward and are not debt. That removed twelve
# entries at once, which is the honest consequence of classifying rather than inverting: the gate no
# longer asks those two crates to hide a dependency they exist to have. The four entries below are
# edges between crates that are NOT composition roots, which is why they are the real ones.
#
# Recorded tradeoff: benchwork-core -> storypole-core (35 sites) and joiner -> sawhorse (13) are now
# downward and ungated. A BacklogPort or CompletionPort there would still buy substitutability, but
# it is a quality goal now, not a gate requirement, and this file says so rather than implying
# otherwise.
#
# Regenerate after a burn-down with: miter deps --layers


[[lateral]]
from = "dado-core"
to = "miter-polyglot"
ticket = "GB-204"

[[lateral]]
from = "outfeed-core"
to = "sawhorse-core"
ticket = "GB-204"

[[lateral]]
from = "outfeed-core"
to = "storypole-core"
ticket = "GB-204"
